# Supported translations of the website. English is the source and is not listed here.
# After editing, run `scripts/generate.sh`.
#
# Each key is a language tag as in languages.yml of iorate/ublacklist, used as
# the Hugo language (it appears in URLs as /<tag>/).
#
# label: language name shown in the language switcher.
# crowdin: language code on Crowdin (default: the tag).
de:
  label: Deutsch
ja:
  label: 日本語
pt-BR:
  label: Português (Brasil)
