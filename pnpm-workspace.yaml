allowBuilds:
  "@swc/core": true
  core-js: false
  core-js-pure: false
  lefthook: true

blockExoticSubdeps: true

minimumReleaseAge: 4320 # 3 days

minimumReleaseAgeExclude:
  # Renovate security update: js-yaml@4.2.0 || 5.2.2
  - js-yaml@4.2.0 || 5.2.2

overrides:
  serialize-javascript@<=7.0.2: 7.1.0
  serialize-javascript@>=5.0.0 <7.0.5: 7.1.0
  uuid@<11.1.1: 14.0.1

trustPolicy: no-downgrade

trustPolicyExclude:
  - detect-port@1.6.1
  - semver@6.3.1
