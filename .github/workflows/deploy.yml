name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Get crowdin download args
        id: crowdin-download-args
        run: echo "args=$(yq 'to_entries | map("--language=" + (.value.crowdin // .key)) | join(" ")' languages.yml)" >> "$GITHUB_OUTPUT"

      - name: Run crowdin
        uses: crowdin/github-action@df474cdfb9f41d6ae777118749477c2cdf7cacc8 # v3.2.0
        with:
          upload_sources: true
          download_translations: true
          export_only_approved: true
          download_translations_args: --ignore-match ${{ steps.crowdin-download-args.outputs.args }}
          push_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Build
        run: scripts/build.sh

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public/
          include-hidden-files: true

  deploy:
    needs: build

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
