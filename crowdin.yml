# Generated by scripts/generate.sh from languages.yml. Do not edit directly.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true
files:
  - source: /i18n/en.yaml
    translation: /i18n/%two_letters_code%.yaml
    dest: /website/content/i18n.yaml
    languages_mapping:
      two_letters_code:
        de: de
        ja: ja
        pt-BR: pt-BR
  - source: /content/en/*.md
    ignore:
      - /content/en/_index.md
    translation: /content/%two_letters_code%/%original_file_name%
    dest: /website/content/%original_file_name%
    languages_mapping:
      two_letters_code:
        de: de
        ja: ja
        pt-BR: pt-BR
  - source: /content/en/docs/*.md
    translation: /content/%two_letters_code%/docs/%original_file_name%
    dest: /website/content/docs/%original_file_name%
    languages_mapping:
      two_letters_code:
        de: de
        ja: ja
        pt-BR: pt-BR
  - source: /content/en/rulesets/*.md
    translation: /content/%two_letters_code%/rulesets/%original_file_name%
    dest: /website/content/rulesets/%original_file_name%
    languages_mapping:
      two_letters_code:
        de: de
        ja: ja
        pt-BR: pt-BR
