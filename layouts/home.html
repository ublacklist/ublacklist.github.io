{{- $docs := strings.TrimSuffix ".html" (site.GetPage "/docs").RelPermalink -}}
<!doctype html>
<html lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <title>{{ site.Title }}</title>
    <link rel="canonical" href="{{ $docs | absURL }}">
    <meta http-equiv="refresh" content="0; url={{ $docs }}">
  </head>
  <body>
    <a href="{{ $docs }}">{{ $docs }}</a>
  </body>
</html>
